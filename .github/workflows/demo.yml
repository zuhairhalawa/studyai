name: Demo

# Builds the public no-AI demo (docs/DEMO.md) and publishes it to GitHub Pages.
# Manual only: pushing or merging never deploys anything. Start it from the Actions tab ("Run workflow", branch main).
# One-time setup by the owner, not done by this file: Settings > Pages > Build and deployment > Source = GitHub Actions.
# While Pages is not enabled the run stops at the configure step and nothing is published.

on:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running deployment is never cancelled half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # configure-pages only reads the Pages settings (it never enables Pages: `enablement` is left at its default, false).
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The demo's own guarantees (policy in the page, no AI client in the bundle, only invented content) are unit tests.
      - run: pnpm test

      # base_path is "/<repository>" (empty on a custom domain), so the demo works wherever Pages serves it.
      - run: pnpm build:demo
        env:
          STUDYAI_DEMO_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-demo

  deploy:
    # Only the default branch is published; a run started from another branch builds and stops here.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # to publish
      id-token: write # lets Pages verify that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
